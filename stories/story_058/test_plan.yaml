test_layers_version: 1
unit_tests:
  required: true
  action: add_or_update
  frequency: every_commit
  evidence_or_reason: Add or update runtime config, Codex runtime, story runner,
    and docs tests for the workspace-write sandbox contract.
integration_tests:
  required: true
  action: confirm_existing
  frequency: before_merge
  evidence_or_reason: Run targeted Codex runtime, runtime config, and story
    runner pytest suites plus full pytest and Ruff in the Docker dev container.
mock_e2e_tests:
  required: true
  action: confirm_existing
  frequency: before_merge
  evidence_or_reason: Story runner tests fake Codex subprocess behavior and
    verify report creation checks, nonzero exit blocking, and safety flags
    without external services.
live_read_only_checks:
  required: true
  action: confirm_existing
  frequency: before_merge
  evidence_or_reason: Run `codex exec --help` inside Docker to confirm the CLI
    exposes the expected command surface without starting a model run.
remote_dev_smoke_tests:
  required: false
  action: not_applicable_with_reason
  frequency: after_remote_dev_deploy
  evidence_or_reason: This story changes local Docker Codex runtime policy only
    and does not deploy remote infrastructure.

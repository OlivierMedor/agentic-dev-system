  - id: STORY-061
    story_id: story_061
    slug: blueprint-defined-context-safe-subtask-execution
    title: Blueprint-Defined Context-Safe Sub-Task Execution
    goal: Define blueprint-driven, dependency-aware sub-task execution that only runs local tasks whose complete required context fits the assigned model's usable input budget.
    why: Story 060 made blueprint-selected local role execution possible. Story 061 makes cloud-planned decomposition explicit and enforceable so local agents execute bounded, context-safe tasks without silently trimming required instructions or falling back to cloud or Codex implementation.
    agents:
      developer:
        writable_paths:
          - src/**
          - tests/**
          - docs/**
          - stories/story_061/reports/**
      test:
        writable_paths:
          - tests/**
          - stories/story_061/reports/**
      documentation:
        writable_paths:
          - README.md
          - docs/**
          - stories/story_061/reports/**
      security_quality:
        writable_paths:
          - stories/story_061/reports/**
      local_reviewer:
        writable_paths:
          - stories/story_061/reports/**
    execution_order:
      - developer
      - test
      - documentation
      - security_quality
      - local_reviewer
    local_execution_constraints:
      decomposition_authority: cloud_planner
      required_context_must_fit: true
      allow_required_context_trimming: false
      oversized_task_policy: reject_for_cloud_redecomposition
      local_agent_may_redecompose: false
      require_independent_token_estimate: true
      require_final_story_validation: true
      maximum_task_size_contract: The complete required prompt for a sub-task, including mandatory system instructions, role instructions, applicable story requirements, relevant source context, dependency handoffs, writable-path rules, output contract, and validation instructions, must fit within the assigned model's usable input-token budget. A task that does not fit must be decomposed further by the cloud planner before local execution.
      forbidden_fallbacks:
        - cloud_model_implementation
        - codex_implementation
        - hidden_implementation_fallback
      required_failure_states:
        dependency_missing: A declared dependency does not reference a known sub-task ID.
        dependency_cycle: The sub-task graph contains a cycle.
        context_budget_invalid: The context window and reserved output budget do not leave a positive usable input budget.
        context_over_budget: The independently estimated complete prompt exceeds the usable input budget.
        cloud_redecomposition_required: The task is too large for local execution and must be returned to the cloud planner for finer decomposition.
        blocked_by_dependency: A dependency is failed, blocked, or waiting for cloud redecomposition.
        file_boundary_violation: A task requested writes outside its declared writable paths or through an unsafe resolved path.
    subtasks:
      - id: define-subtask-schema
        title: Define blueprint sub-task schema
        role: developer
        depends_on: []
        requirement_ids:
          - AC-001
          - AC-002
          - AC-003
          - AC-007
          - AC-008
          - AC-009
          - AC-010
          - AC-030
        required_context:
          files:
            - blueprints/blueprint.yaml
            - src/agentic_dev/story_blueprint.py
            - src/agentic_dev/agent_assignment.py
            - tests/test_agent_assignment.py
            - tests/test_story_generator.py
          summaries:
            - Existing story blueprint lookup accepts unknown story fields and agent assignment reads the agents and execution_order sections.
            - Preserve Story 060 behavior for blueprints that do not define subtasks.
          prior_task_outputs: []
          architecture_decisions: []
        writable_paths:
          - src/**
          - tests/**
          - stories/story_061/reports/**
        expected_outputs:
          - Schema or parsing helpers for sub-task IDs, dependencies, roles, required context, writable paths, expected outputs, validation rules, and context budgets.
          - Focused tests proving backward compatibility for stories without subtasks.
        validation:
          - Unit tests reject malformed sub-task records.
          - Story 060 agent assignment tests remain green.
        context_budget:
          max_input_tokens: 24000
          reserved_output_tokens: 4000
          required_context_must_fit: true
          allow_required_context_trimming: false
          oversized_task_policy: reject_for_cloud_redecomposition
      - id: validate-subtask-graph
        title: Add dependency graph validation
        role: developer
        depends_on:
          - define-subtask-schema
        requirement_ids:
          - AC-004
          - AC-005
          - AC-006
          - AC-029
        required_context:
          files:
            - src/agentic_dev/story_blueprint.py
            - tests/test_agent_assignment.py
          summaries:
            - Execution order must be deterministic and dependency-aware.
          prior_task_outputs:
            - define-subtask-schema
          architecture_decisions: []
        writable_paths:
          - src/**
          - tests/**
          - stories/story_061/reports/**
        expected_outputs:
          - Duplicate IDs, missing dependencies, self-dependencies, and cycles are rejected before execution.
          - Deterministic topological ordering is available to local execution.
        validation:
          - Tests cover duplicate IDs, missing references, self-dependencies, cycles, and stable ordering.
        context_budget:
          max_input_tokens: 24000
          reserved_output_tokens: 4000
          required_context_must_fit: true
          allow_required_context_trimming: false
          oversized_task_policy: reject_for_cloud_redecomposition
      - id: resolve-context-budgets

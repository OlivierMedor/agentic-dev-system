  - id: STORY-043
    slug: story_043_local_model_scorecard
    title: Local Model Scorecard
    goal: Add a repeatable local model scorecard workflow so the project owner can compare local models such as Qwen3 Coder, Devstral, Qwen2.5 Coder, and Gemma on the same agent-style tasks before assigning models to agent roles.
    why: The system should not guess which local model is best. It should standardize local-agent prompts, save comparable responses, and leave final role assignment to manual scoring and review.

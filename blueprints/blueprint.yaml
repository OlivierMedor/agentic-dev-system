  - id: STORY-063
    story_id: story_063
    slug: structured-cloud-escalation-and-manual-packet-queue
    title: Story 063 - Structured Cloud Escalation and Manual Packet Queue
    goal: Define a provider-neutral, manual-first cloud escalation queue that packages local blockers into self-contained request packets, accepts untrusted cloud responses, validates them independently, classifies safe decompositions, and records approval decisions without invoking paid cloud APIs.
    why: Story 061 made context-safe local execution explicit, and Story 062 proved the end-to-end local demo path plus post-merge verification. Story 063 adds the missing cloud escalation boundary so a blocked local task can be packaged, exported, manually reviewed in any compatible cloud model, re-imported safely, and classified for either approval or later automatic application while remaining provider-neutral and offline-friendly.
    acceptance_criteria:
      - A local execution blocker can create a queue item.
      - Queue items have stable unique IDs.
      - Request schema is versioned.
      - Queue state transitions are validated.
      - Unsupported transitions are rejected.
      - Request packets are self-contained.
      - Request packets include relevant requirements.
      - Request packets include blocker evidence.
      - Request packets include exact response schema.
      - Secrets are redacted.
      - ".env contents are excluded."
      - Export packet size is bounded.
      - Single-request export works.
      - Batch export works.
      - Only ready independent requests are batched.
      - Dependent requests are not exported prematurely.
      - Batch ordering is deterministic.
      - Export checksums are persisted.
      - YAML response import works.
      - ZIP response-bundle import works.
      - ZIP-slip attacks are rejected.
      - Unknown request IDs are rejected.
      - Duplicate response IDs are rejected.
      - Invalid schema versions are rejected.
      - Malformed YAML is rejected safely.
      - Raw imported responses are preserved safely.
      - Normalized responses are persisted.
      - Requirements are independently compared.
      - Writable paths are independently compared.
      - External-service additions are detected.
      - Safe decompositions are classified as safe candidates.
      - Scope-changing responses require approval.
      - Invalid responses do not corrupt valid responses in the same batch.
      - No imported response executes code.
      - Audit logs contain state transitions and checksums.
      - Logs do not expose secrets.
      - Manual packet mode works without network access.
      - CI uses deterministic fixtures.
      - Future provider adapters can use the same canonical schemas.
      - OpenAI and Gemini can be added later without changing queue records.
      - Story 061 context-safe task rules remain enforced.
      - Story 062 demo and post-merge verification remain backward compatible.
      - No cloud or Codex fallback is introduced.
      - No automatic API charges can occur in Story 063.
      - Operator documentation explains export, upload, response download, and import.
      - Error messages are actionable.
      - Queue artifacts follow artifact policy.
      - Generation remains idempotent.
    implementation_scope:
      - Structured cloud escalation queue records
      - Canonical versioned request and response schemas
      - Request states, deterministic transitions, and audit history
      - Manual packet export and import workflows
      - Single-request and ready-batch packet generation
      - Safe archive extraction and path traversal rejection
      - Secret redaction, file allowlists, and packet limits
      - Requirement, writable-path, architecture, and external-service comparison
      - Safe-candidate versus approval-required versus invalid classification
      - Manual approval and rejection commands
      - Provider-neutral adapter interfaces with a manual packet adapter
      - Future compatibility for OpenAI, Gemini, Anthropic, Bedrock, and OpenAI-compatible providers
      - Offline deterministic fixtures and no paid API calls
      - Backward compatibility for Stories 060, 061, and 062
    agents:
      developer:
        writable_paths:
          - src/**
          - tests/**
          - docs/**
          - stories/story_063/reports/**
      test:
        writable_paths:
          - tests/**
          - stories/story_063/reports/**
      documentation:
        writable_paths:
          - README.md
          - docs/**
          - stories/story_063/reports/**
      security_quality:
        writable_paths:
          - stories/story_063/reports/**
      local_reviewer:
        writable_paths:
          - stories/story_063/reports/**
    execution_order:
      - developer
      - test
      - documentation
      - security_quality
      - local_reviewer
    local_execution_constraints:
      decomposition_authority: cloud_planner
      required_context_must_fit: true
      allow_required_context_trimming: false
      oversized_task_policy: reject_for_cloud_redecomposition
      local_agent_may_redecompose: false
      require_independent_token_estimate: true
      require_final_story_validation: true
      maximum_task_size_contract: The complete required prompt for a Story 063 cloud escalation task, including system instructions, canonical request schema, manual export and import rules, untrusted-response validation, approval boundaries, dependency handoffs, writable-path rules, output contract, and audit requirements, must fit within the assigned model's usable input-token budget. Oversized tasks must be returned to the cloud planner for finer decomposition before any local execution or packet export.
      forbidden_fallbacks:
        - cloud_model_implementation
        - codex_implementation
        - hidden_implementation_fallback
      required_failure_states:
        schema_invalid: The request or response schema does not validate against the canonical versioned contract.
        transition_invalid: The requested queue state transition is not allowed.
        export_not_ready: The request is not ready for export or depends on another unresolved cloud response.
        duplicate_request_id: A duplicate request or response identifier was discovered.
        unknown_request_id: An imported response does not match a known exported request.
        zip_slip_detected: An imported archive attempts path traversal or extraction outside the allowed root.
        secret_redaction_required: The exported packet still contains a secret or credential-like value.
        packet_limit_exceeded: A request or response exceeds the configured file, size, or bundle limits.
        approval_required: The response changes requirements, scope, architecture, or safety boundaries.
        validation_failed: Requirement comparison, path comparison, or response normalization failed.
        no_paid_api_call_allowed: A design or adapter attempts to rely on paid cloud API execution in Story 063.
        provider_metadata_mismatch: Provider-specific hints conflict with the canonical provider-neutral record.
        batch_dependency_blocked: A request depends on another cloud result that has not been validated and applied.

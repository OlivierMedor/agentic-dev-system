  - id: STORY-065
    story_id: story_065
    slug: parallel-cloud-escalation-batching-and-multi-request-orchestration
    title: Story 065 - Parallel Cloud Escalation Batching and Multi-Request Orchestration
    goal: Extend Stories 063 and 064 so the system can orchestrate multiple independent cloud escalations and their resulting runtime applications as one dependency-aware batch.
    why: Story 063 safely imports and classifies cloud responses, and Story 064 safely applies one response at a time. Story 065 adds a batch orchestration layer so multiple request, response, application, resume, rollback, and recovery operations stay independently traceable while still being scheduled in deterministic dependency-aware waves.
    agents:
      developer:
        writable_paths:
          - src/**
          - tests/**
          - docs/**
          - stories/parallel-cloud-escalation-batching-and-multi-request-orchestration/reports/**
      test:
        writable_paths:
          - tests/**
          - stories/parallel-cloud-escalation-batching-and-multi-request-orchestration/reports/**
      documentation:
        writable_paths:
          - README.md
          - docs/**
          - stories/parallel-cloud-escalation-batching-and-multi-request-orchestration/reports/**
      security_quality:
        writable_paths:
          - stories/parallel-cloud-escalation-batching-and-multi-request-orchestration/reports/**
      local_reviewer:
        writable_paths:
          - stories/parallel-cloud-escalation-batching-and-multi-request-orchestration/reports/**
    execution_order:
      - developer
      - test
      - documentation
      - security_quality
      - local_reviewer
    local_execution_constraints:
      decomposition_authority: cloud_planner
      required_context_must_fit: true
      allow_required_context_trimming: false
      oversized_task_policy: reject_for_cloud_redecomposition
      local_agent_may_redecompose: false
      require_independent_token_estimate: true
      require_final_story_validation: true
      require_dry_run_before_apply: true
      preserve_canonical_blueprint: true
      require_atomic_application: true
      require_revision_bound_leases: true
      allow_paid_provider_calls: false
      allow_network_access: false
      allow_automatic_git_revert: false
      allow_automatic_merge: false
      cloud_batch_orchestration:
        enabled: true
        max_parallel_requests: 4
        max_parallel_applications: 2
        max_parallel_resumes: 2
        fail_fast: false
        continue_on_independent_failure: true
        require_explicit_batch_apply: true
        require_explicit_batch_resume: true
        auto_retry_transient_failures: false
        manual_cloud_mode_only: true
      maximum_task_size_contract: The complete required prompt for a Story 065 batch task, including per-request schemas, per-response validation, per-application checksums, dependency-graph rules, execution-wave planning, resume gating, rollback limits, writable-path rules, and audit requirements, must fit within the assigned model's usable input-token budget. Oversized tasks must be returned to the cloud planner for finer decomposition before any batch export, import, apply, resume, retry, cancel, or rollback attempt.
      forbidden_fallbacks:
        - cloud_model_implementation
        - paid_provider_call
        - hidden_implementation_fallback
      required_failure_states:
        batch_validation_failed: The proposed batch plan failed validation.
        batch_transition_invalid: The batch state transition is not allowed.
        batch_dependency_cycle: The proposed batch graph contains a cycle.
        batch_dependency_missing: The proposed batch graph references a missing dependency.
        batch_export_not_ready: The ready export batch is not valid for export.
        batch_import_invalid: The imported response bundle failed validation.
        duplicate_batch_request: The same request was claimed by another batch.
        duplicate_batch_response: The same response was imported more than once.
        unknown_batch_response: An imported response did not match a known request.
        stale_batch_plan: The batch plan changed after it was created.
        application_conflict: Two eligible applications cannot run concurrently.
        resume_conflict: Two resume groups cannot safely run together.
        rollback_conflict: Rollback would cross an unsafe dependency or revision boundary.
        lease_conflict: A revision-bound lease or writable path is already held.
        recovery_required: The batch record or batch state is incomplete or corrupt and needs operator recovery.
    acceptance_criteria:
      - A batch can group multiple independent cloud requests.
      - Dependent requests are not exported prematurely.
      - Batch membership is immutable after export.
      - Each request retains its own checksum.
      - The batch manifest has its own checksum.
      - A multi-response bundle can be imported.
      - Malformed responses are isolated from valid siblings.
      - Missing responses remain pending.
      - Later import of missing responses works.
      - Duplicate responses are rejected.
      - Unknown responses are rejected.
      - Batch status is derived from item states.
      - Partial success is represented accurately.
      - Complete failure is represented accurately.
      - The dependency DAG is validated.
      - Cycles are rejected.
      - Deterministic scheduling order is used.
      - Independent validation may run in parallel.
      - Application conflicts are detected.
      - Conflicting applications are serialized or blocked.
      - Application plans remain individual.
      - Application checksums remain individual.
      - Approvals remain individual.
      - Runtime pointer updates remain serialized.
      - One active runtime revision exists.
      - Dry run makes no mutation.
      - Dry run reports execution waves.
      - Batch apply uses Story 064 transactions.
      - One application failure blocks only dependents.
      - Independent applications may continue.
      - Per-item application results are preserved.
      - Resume uses Story 064 leases.
      - Conflicting writable-path groups do not run together.
      - Blocked resume groups do not run.
      - Independent resume groups may run concurrently.
      - Stale workers cannot publish.
      - Retry creates a new attempt.
      - Retry preserves prior evidence.
      - Stale retry is rejected.
      - Malformed responses are not retried automatically.
      - Cancellation prevents new work.
      - Cancellation preserves completed work.
      - Running leases are handled safely.
      - Batch rollback uses reverse order.
      - Unsafe rollback is rejected.
      - Partial rollback is represented.
      - Git changes are never automatically reverted.
      - Batch records are versioned.
      - Batch records are immutable where required.
      - Batch audit is append-only.
      - Item audit remains intact.
      - Runtime artifacts are not committed.
      - Artifact policy detects tracked batch artifacts.
      - Public readiness excludes batch artifacts.
      - Windows behavior is supported.
      - Linux behavior is supported.
      - Story 063 behavior remains intact.
      - Story 064 behavior remains intact.
      - Generation remains idempotent.
      - No paid provider integration is introduced.

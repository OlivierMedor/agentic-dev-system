project:
  name: agentic-dev-system
  type: agentic_development_tool
  description: Reusable agentic development workflow system.

story_sizing_rule: >
  User stories should be narrow enough to have clear acceptance criteria and a focused code change,
  but large enough to justify the full agent workflow: Research, Planner, Developer, Test, Docs,
  Security/Quality, and Reviewer. If only one agent has meaningful work, the story is probably
  too small. If the story touches many unrelated features or modules, it is probably too large.

stories:
  - id: STORY-004
    slug: story_004_agent_assignment
    title: Add automatic agent assignment
    goal: Create a command that assigns the correct core agents to a story workspace.
    why: Agent assignment should be consistent and based on the story instructions and project rules.
    acceptance_criteria:
      - Add an agent assignment command.
      - Create an agent_plan.yaml file inside the story folder.
      - Include all core agents by default.
      - Add specialist agents later based on story content.
    not_in_scope:
      - No LangGraph execution yet.
      - No model-based agent selection yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - agent_plan.yaml is created for the target story.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_agent_instruction
        - invalid_story_folder

  - id: STORY-005
    slug: story_005_quality_gate
    title: Add quality gate command
    goal: Create a command that checks whether a story is ready for human/cloud review.
    why: The system needs a clear pass/fail gate before code is reviewed or merged.
    acceptance_criteria:
      - Add a quality gate command.
      - Check pytest result.
      - Check ruff result.
      - Check that a review bundle exists.
      - Check that required story reports exist.
    not_in_scope:
      - No deployment validation yet.
      - No production release bundle yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - quality gate produces READY_FOR_REVIEW or REQUEST_CHANGES.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_review_bundle
        - failing_test_output
        - missing_required_report
  - id: STORY-006
    slug: story_006_agent_prompt_packs
    title: Generate agent prompt packs for each story
    goal: Create a command that generates Codex-ready prompt files for each assigned agent in a story.
    why: The system should reduce manual prompt writing by creating role-specific prompts from the story, agent plan, project rules, test plan, and monitoring plan.
    acceptance_criteria:
      - Add a generate-prompts command.
      - The command requires --story.
      - The command defaults --project to the current working directory.
      - The command creates a prompt_pack folder inside the story folder.
      - The command creates one prompt file per assigned agent.
      - Each prompt includes the story goal, acceptance criteria, agent responsibility, safety rules, test plan, monitoring plan, and expected output.
      - The Test Agent prompt clearly says it should not modify implementation code unless a small fix is required and explained.
      - The Developer Agent prompt clearly says it should not write tests.
      - The Local Reviewer prompt clearly says it must not approve unless pytest and Ruff pass.
    not_in_scope:
      - No automatic execution of Codex yet.
      - No LangGraph yet.
      - No model API calls yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - prompt_pack files are generated for all assigned agents.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_agent_plan
        - missing_story_file
        - missing_prompt_pack
        - invalid_prompt_output
  - id: STORY-007
    slug: story_007_prepare_story_command
    title: Add prepare-story command
    goal: Create a command that prepares a story for agent execution by assigning agents, generating prompt packs, creating a runbook, and updating story preparation status.
    why: The system should reduce manual setup before each story. Instead of manually running assign-agents and generate-prompts, one command should prepare the story workspace for agent work.
    acceptance_criteria:
      - Add a prepare-story command.
      - The command requires --story.
      - The command defaults --project to the current working directory.
      - The command accepts optional --force.
      - The command validates that the story folder exists.
      - The command creates or refreshes agent_plan.yaml.
      - The command creates or refreshes prompt_pack files.
      - The command creates story_runbook.md.
      - The command creates reports/prepare_story_report.md.
      - The command updates status.yaml to show the story is prepared.
      - The command does not execute the agents.
      - The command does not run cloud models.
      - The command does not create a review bundle.
      - The command does not run quality gate automatically.
    not_in_scope:
      - No automatic Codex execution yet.
      - No LangGraph yet.
      - No model API calls yet.
      - No GitHub PR automation yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - prepare-story creates agent_plan.yaml.
      - prepare-story creates prompt_pack files.
      - prepare-story creates story_runbook.md.
      - prepare-story creates reports/prepare_story_report.md.
      - prepare-story updates status.yaml safely.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_story_folder
        - failed_agent_assignment
        - failed_prompt_generation
        - missing_prompt_pack
        - invalid_status_update

  - id: STORY-008
    slug: story_008_finalize_story_command
    title: Add finalize-story command
    goal: Create a command that finalizes a story by generating a review bundle, running the quality gate, regenerating the review bundle, writing a finalize report, and updating story status.
    why: The system should reduce manual final review steps after agent work is completed. One command should collect evidence, run the quality gate, record the result, and mark the story ready for human/cloud review or request changes.
    acceptance_criteria:
      - Add a finalize-story command.
      - The command requires --story.
      - The command defaults --project to the current working directory.
      - The command accepts optional --force.
      - The command validates that the story folder exists.
      - The command creates or refreshes the review bundle.
      - The command runs the quality gate.
      - The command regenerates the review bundle after the quality gate so final evidence is captured.
      - The command writes reports/finalize_story_report.md.
      - The command writes reports/finalize_story_result.yaml.
      - If the quality gate returns READY_FOR_REVIEW, the command updates status.yaml to ready_for_review true.
      - If the quality gate returns REQUEST_CHANGES, the command updates status.yaml to request_changes and ready_for_review false.
      - The command does not commit, push, merge, deploy, or call cloud models.
    not_in_scope:
      - No automatic Git commits.
      - No automatic GitHub PR creation.
      - No cloud model review yet.
      - No remote dev validation yet.
      - No production deployment.
      - No LangGraph yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - finalize-story creates review bundle evidence.
      - finalize-story creates quality gate outputs.
      - finalize-story creates finalize report files.
      - finalize-story updates status.yaml safely.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_story_folder
        - review_bundle_failure
        - quality_gate_failure
        - invalid_status_update
        - missing_finalize_report

  - id: STORY-009
    slug: story_009_github_actions_ci
    title: Add GitHub Actions CI workflow
    goal: Create a GitHub Actions workflow that automatically builds the Docker environment and runs quality checks on pushes and pull requests.
    why: The system should not rely only on local checks. Every PR should prove that the project builds and passes tests in a clean GitHub runner before merge.
    acceptance_criteria:
      - Add .github/workflows/ci.yml.
      - CI runs on pull requests targeting main.
      - CI runs on pushes to main and story branches.
      - CI builds the Docker Compose environment.
      - CI runs pytest inside the dev container.
      - CI runs Ruff inside the dev container.
      - CI runs agentic generate-stories as an idempotency/sanity check.
      - CI fails if generated stories are missing from the committed repo.
      - Add tests that verify the workflow file contains the required CI commands.
      - Update README with CI usage notes.
      - Add docs/ci_cd.md explaining what the CI workflow checks.
    not_in_scope:
      - No deployment.
      - No remote dev validation environment.
      - No GitHub branch protection automation.
      - No cloud model review integration.
      - No secrets or environment-specific credentials.
    definition_of_done:
      - pytest passes locally.
      - ruff passes locally.
      - .github/workflows/ci.yml exists.
      - tests verify the CI workflow content.
      - GitHub Actions runs successfully on the PR.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - github_actions_failure
        - docker_build_failure
        - pytest_failure
        - ruff_failure
        - missing_generated_story_files

  - id: STORY-010
    slug: story_010_cloud_review_packet
    title: Add cloud review packet command
    goal: Create a command that prepares a cloud-model-ready review packet for a completed story.
    why: The strong cloud model needs a clean, structured packet that summarizes the story, evidence, quality gate result, changed files, risks, and specific review questions before a human approves merge.
    acceptance_criteria:
      - Add a cloud-review-packet command.
      - The command requires --story.
      - The command defaults --project to the current working directory.
      - The command validates that the story folder exists.
      - The command creates a cloud_review_packet folder inside the story folder.
      - The command creates cloud_review_prompt.md.
      - The command creates cloud_review_context.md.
      - The command creates cloud_review_checklist.md.
      - The command creates cloud_review_result_template.md.
      - The prompt tells the cloud model to review architecture, correctness, tests, maintainability, security, scope control, and merge readiness.
      - The prompt tells the cloud model not to invent missing facts.
      - The prompt tells the cloud model to return APPROVE, APPROVE_WITH_NOTES, or REQUEST_CHANGES.
      - The context includes story content, quality gate result, finalize result if present, review bundle handoff if present, and Git status if present.
      - The command does not call cloud models automatically.
      - The command does not commit, push, merge, or deploy.
    not_in_scope:
      - No automatic cloud API calls.
      - No automatic PR comments.
      - No GitHub bot integration.
      - No remote dev validation.
      - No production deployment.
      - No LangGraph yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - cloud-review-packet creates all expected files.
      - finalize-story returns ready_for_review.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_story_folder
        - missing_quality_gate_result
        - missing_review_bundle
        - missing_cloud_review_packet
        - invalid_cloud_review_prompt

  - id: STORY-013
    slug: story_013_dynamic_agent_runtime_config
    title: Add dynamic agent runtime config
    goal: Create a project-level runtime config that defines which provider/model each agent should use and what commands are allowed without repeated human approval.
    why: The system should support different execution modes for different agents. Some agents may use Codex, some may use local models, and final review may use a manual cloud model. The project should also define safe command policies so agents do not ask for approval on routine checks but still require approval for risky actions.
    acceptance_criteria:
      - Add .agentic/agent_runtime.yaml to initialized projects.
      - Add an agentic runtime-config validate command.
      - Add an agentic runtime-config show command.
      - Runtime config defines agent providers, models, approval modes, and fallback providers.
      - Runtime config defines commands allowed without approval.
      - Runtime config defines commands requiring human approval.
      - Runtime config includes cloud_reviewer as manual_cloud_model.
      - Runtime config includes local_model_optional as a supported future provider type.
      - Prompt pack generation includes runtime config content when present.
      - Tests verify runtime config creation, validation, and prompt-pack inclusion.
      - README explains how runtime config works.
    not_in_scope:
      - No actual local model installation.
      - No automatic Codex execution.
      - No automatic cloud API calls.
      - No LangGraph yet.
      - No direct enforcement of command policies by Codex yet.
      - No remote deployment.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - artifact-policy passes.
      - runtime-config validate passes on the current repo.
      - generate-prompts includes runtime config guidance.
      - finalize-story marks this story ready for review.
    test_plan:
      unit_tests: true
      integration_tests: false
      frequency: every_commit
    monitoring_plan:
      logs_required: true
      watch_for:
        - missing_agent_runtime_config
        - invalid_agent_provider
        - invalid_approval_mode
        - unsafe_command_policy
        - missing_cloud_reviewer_config

  - id: STORY-014
    slug: story_014_test_layer_support
    title: Add test layer support
    goal: Create structured support for unit, integration, mock E2E, live read-only, and remote dev smoke test layers in story test plans and quality gates.
    why: Every story should address the full testing picture. A story may add new tests, update existing tests, confirm existing coverage, or explain why a layer is not applicable. The quality gate should be able to verify that the required testing layers were addressed before human/cloud review.
    acceptance_criteria:
      - Add a standard test layer schema for story test plans.
      - Add an agentic test-layers command.
      - test-layers validates that each testing layer is addressed.
      - test-layers writes reports/test_layer_result.yaml.
      - test-layers writes reports/test_layer_report.md.
      - Story test plans support unit_tests, integration_tests, mock_e2e_tests, live_read_only_checks, and remote_dev_smoke_tests.
      - Each layer must have required, action, frequency, and evidence_or_reason fields.
      - Valid actions include add_or_update, update_existing, confirm_existing, not_applicable_with_reason, scheduled_later_with_reason.
      - Update story generation so new stories get the full test layer template.
      - Update prompt pack generation so Test Agent prompts explain the test layer requirements.
      - Update quality gate so it checks test layer results when a story uses the new test layer schema.
      - Update finalize-story so it runs test-layers before quality-gate when applicable.
      - Add docs/test_layers.md explaining the testing layers.
      - Add tests for the test layer validation logic.
      - README is updated with usage instructions.
    not_in_scope:
      - No Playwright/Cypress/Selenium setup.
      - No real live API calls.
      - No remote dev environment yet.
      - No actual deployment smoke tests yet.
      - No LangGraph yet.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - artifact-policy passes.
      - runtime-config validate passes.
      - test-layers passes for story_014_test_layer_support.
      - finalize-story marks this story ready for review.
    test_plan:
      test_layers_version: 1
      unit_tests:
        required: true
        action: add_or_update
        frequency: every_commit
        evidence_or_reason: Add unit tests for test layer validation logic.
      integration_tests:
        required: true
        action: confirm_existing
        frequency: every_pull_request
        evidence_or_reason: Existing CLI tests and quality gate tests cover command integration.
      mock_e2e_tests:
        required: true
        action: scheduled_later_with_reason
        frequency: before_merge
        evidence_or_reason: Full workflow E2E will be added in a future story after test layer support exists.
      live_read_only_checks:
        required: false
        action: not_applicable_with_reason
        frequency: scheduled_or_before_release
        evidence_or_reason: This story does not depend on external live services.
      remote_dev_smoke_tests:
        required: false
        action: not_applicable_with_reason
        frequency: after_remote_dev_deploy
        evidence_or_reason: No remote dev environment exists yet.
    monitoring_plan:
      logs_required: true
      watch_for:
        - invalid_test_plan
        - missing_test_layer_result
        - missing_test_layer_evidence
        - quality_gate_test_layer_failure
        - finalize_story_test_layer_failure

  - id: STORY-015
    slug: story_015_mock_e2e_workflow_test
    title: Add mock E2E workflow test
    goal: Create a project-level mock end-to-end test that verifies the core agentic workflow from project initialization through story finalization.
    why: The system should prove that the full local workflow works, not only individual commands. A mock E2E test gives us confidence that init, blueprint story generation, story preparation, test-layer validation, and finalization work together safely without live services.
    acceptance_criteria:
      - Add tests/e2e/test_agentic_workflow.py.
      - The E2E test uses a temporary project folder.
      - The E2E test initializes the project.
      - The E2E test creates a blueprint with a sample story.
      - The E2E test generates story workspaces.
      - The E2E test prepares the generated story.
      - The E2E test creates simulated required reports and review evidence.
      - The E2E test runs test layer validation.
      - The E2E test finalizes the story.
      - The E2E test confirms status.yaml is ready_for_review true.
      - The E2E test does not use live APIs.
      - The E2E test does not call cloud models.
      - The E2E test does not require a real Git repo.
      - Docs explain the difference between unit, integration, mock E2E, live checks, and smoke tests.
    not_in_scope:
      - No Playwright, Cypress, Selenium, or browser testing.
      - No live API calls.
      - No remote dev deployment.
      - No production smoke tests.
      - No LangGraph yet.
      - No automatic Codex execution.
    definition_of_done:
      - pytest passes.
      - ruff passes.
      - artifact-policy passes.
      - runtime-config validate passes.
      - mock E2E test passes.
      - finalize-story marks this story ready for review.
    test_plan:
      test_layers_version: 1
      unit_tests:
        required: true
        action: confirm_existing
        frequency: every_commit
        evidence_or_reason: Existing command-level tests cover unit behavior for individual workflow commands.
      integration_tests:
        required: true
        action: confirm_existing
        frequency: every_pull_request
        evidence_or_reason: Existing command tests cover integration between generated files and command outputs.
      mock_e2e_tests:
        required: true
        action: add_or_update
        frequency: before_merge
        evidence_or_reason: Add tests/e2e/test_agentic_workflow.py to exercise the full local workflow with mock data.
      live_read_only_checks:
        required: false
        action: not_applicable_with_reason
        frequency: scheduled_or_before_release
        evidence_or_reason: This story does not use live external APIs or services.
      remote_dev_smoke_tests:
        required: false
        action: not_applicable_with_reason
        frequency: after_remote_dev_deploy
        evidence_or_reason: No remote dev deployment environment exists yet.
    monitoring_plan:
      logs_required: true
      watch_for:
        - e2e_workflow_failure
        - missing_generated_story
        - failed_test_layer_validation
        - failed_finalize_story
        - unexpected_live_service_usage

  - id: STORY-016
    slug: story_016_cloud_review_result_recording
    title: Add cloud review export and result recording
    goal: Create a one-file cloud review export and a command that records the main cloud model's review decision back into the story reports.
    why: The system needs a clean handoff to the main cloud model and a structured way to store the model's review decision before merge. This closes the loop between local quality gates, cloud review, and human approval.
    acceptance_criteria:
      - Update cloud-review-packet to create cloud_review_export.md.
      - cloud_review_export.md combines prompt, context, checklist, result template, and key review evidence into one file.
      - Add a record-cloud-review command.
      - record-cloud-review requires --story and --result-file.
      - record-cloud-review defaults --project to the current working directory.
      - record-cloud-review validates that the story folder exists.
      - record-cloud-review validates that the result file exists.
      - record-cloud-review extracts a decision from the result file.
      - Accepted decisions are APPROVE, APPROVE_WITH_NOTES, and REQUEST_CHANGES.
      - record-cloud-review writes reports/cloud_review_result.yaml.
      - record-cloud-review writes reports/cloud_review_report.md.
      - APPROVE updates status.yaml to cloud_review_approved.
      - APPROVE_WITH_NOTES updates status.yaml to cloud_review_approved_with_notes.
      - REQUEST_CHANGES updates status.yaml to request_changes.
      - record-cloud-review preserves story_id in status.yaml.
      - The command does not call cloud models automatically.

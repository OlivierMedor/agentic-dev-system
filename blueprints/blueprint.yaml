  - id: STORY-048
    slug: story_048_micro_local_agent_prompt_mode
    title: Add Micro Local-Agent Prompt Mode For Gemma Reliability
    goal: Add a smaller local-agent prompt mode designed for local reasoning models like Gemma that may spend too much output budget in reasoning_content and return empty visible message.content.
    why: Gemma can answer tiny direct prompts but still fail local-agent drafts in slim mode because the story prompt is too large or too reasoning-heavy. A micro mode should provide the smallest final-answer-focused context while preserving save-only local draft boundaries.
    acceptance_criteria:
      - Add --prompt-mode micro to local-agent draft.
      - Keep full and slim modes working.
      - Make micro mode much smaller than slim mode.
      - Create micro context packets under stories/STORY_SLUG/reports/local_agent_context/AGENT_ID_MODEL_LABEL_context.md.
      - Micro metadata records prompt_mode micro, context_character_count, and source_files_used.
      - Micro context includes story slug, agent id, agent role or responsibility, one short story goal, up to five top acceptance criteria, expected output path, safety boundary, and final visible answer instructions.
      - Micro context excludes review bundles, cloud review packets, remote dev validation packets, raw model responses, prior local-agent drafts, unrelated story files, large reports, and long prompt packs.
      - Micro mode targets a short prompt, ideally under 2,000 characters where practical.
      - If micro context exceeds a reasonable threshold, metadata records a warning.
      - Empty visible message.content still fails with status empty_model_response.
      - Non-empty visible content with finish_reason length saves a draft with a warning.
      - Do not use reasoning_content as the final draft by default.
      - Raw local model responses are still saved for debugging.
      - Do not apply local model output to source files.
      - Do not call cloud models.
      - Do not commit generated local-agent runtime artifacts.
      - Update local-agent context, draft, local model, and relevant README documentation.
      - Tests use fake local model HTTP clients and do not require a live model server.
    not_in_scope:
      - No automatic source edits from local model output.
      - No shell command execution from model output.
      - No cloud model calls.
      - No automatic commit, push, merge, deploy, or GitHub API calls.
      - No committing local_agent_drafts output files.
      - No committing local_agent_context runtime files.
      - No committing raw local model response files.
      - No hardcoded tiny output token limit.
      - No secret exposure.
    definition_of_done:
      - docker compose build passes.
      - pytest passes.
      - ruff passes.
      - artifact-policy passes.
      - public-readiness passes.
      - runtime-config validate passes.
      - project-status runs.
      - Story 048 prepare workflow-run passes.
      - Story 048 local-finalize workflow-run passes.
      - Story 048 cloud-review-prep workflow-run passes.
      - Review bundle is generated for Story 048 but generated bundle files are not committed.
      - Story reports are written for development, testing, and local review.
    test_plan:
      test_layers_version: 1
      unit_tests:
        required: true
        action: add_or_update
        frequency: every_commit
        evidence_or_reason: Add tests for micro prompt mode acceptance, context packet creation, metadata fields, exclusions, required micro prompt content, micro smaller than slim, empty visible response failure, non-empty length warning behavior, prompt-file mode, and continued full and slim modes.
      integration_tests:
        required: true
        action: add_or_update
        frequency: every_pull_request
        evidence_or_reason: CLI tests cover local-agent draft prompt-mode wiring with fake runtime calls.
      mock_e2e_tests:
        required: true
        action: confirm_existing
        frequency: before_merge
        evidence_or_reason: Existing mock E2E workflow coverage exercises story workflow; local model calls are unit-tested with fake HTTP clients.
      live_read_only_checks:
        required: false
        action: not_applicable_with_reason
        frequency: manual_only
        evidence_or_reason: Live local draft calls depend on optional host-side LM Studio or Ollama setup and are not required in automated tests.
      remote_dev_smoke_tests:
        required: false
        action: not_applicable_with_reason
        frequency: after_remote_dev_deploy
        evidence_or_reason: This story does not deploy to a remote dev environment.
    monitoring_plan:
      logs_required: true
      watch_for:
        - empty_model_response
        - hidden_reasoning_without_visible_content
        - oversized_micro_local_agent_prompt
        - truncated_local_model_output
        - missing_local_agent_context_packet
        - committed_local_agent_context
        - committed_local_agent_draft
        - committed_raw_response
        - accidental_source_edit_from_model_output
        - model_output_executed
        - secret_exposure
        - cloud_model_call

  - id: STORY-064
    story_id: story_064
    slug: safe-cloud-response-application-and-local-resume
    title: Story 064 - Safe Cloud Response Application and Local Execution Resume
    goal: Allow a validated or explicitly approved cloud response from Story 063 to be applied safely to the runtime execution plan and unblock local execution.
    why: Story 063 safely imports and classifies cloud responses, but the repository still needs a transactional, revision-bound application layer that can convert an eligible response into an immutable runtime-plan update without rewriting the canonical blueprint.
    agents:
      developer:
        writable_paths:
          - src/**
          - tests/**
          - docs/**
          - stories/story_064/reports/**
      test:
        writable_paths:
          - tests/**
          - stories/story_064/reports/**
      documentation:
        writable_paths:
          - README.md
          - docs/**
          - stories/story_064/reports/**
      security_quality:
        writable_paths:
          - stories/story_064/reports/**
      local_reviewer:
        writable_paths:
          - stories/story_064/reports/**
    execution_order:
      - developer
      - test
      - documentation
      - security_quality
      - local_reviewer
    local_execution_constraints:
      decomposition_authority: cloud_planner
      required_context_must_fit: true
      allow_required_context_trimming: false
      oversized_task_policy: reject_for_cloud_redecomposition
      local_agent_may_redecompose: false
      require_independent_token_estimate: true
      require_final_story_validation: true
      auto_apply_validated_safe: false
      auto_resume_after_apply: false
      require_dry_run_before_apply: true
      preserve_canonical_blueprint: true
      require_atomic_application: true
      require_revision_bound_leases: true
      allow_paid_provider_calls: false
      allow_network_access: false
      allow_automatic_git_revert: false
      allow_automatic_merge: false
      maximum_task_size_contract: The complete required prompt for a Story 064 application task, including request and response checksums, approval binding, runtime revision checks, graph diffing, resume logic, rollback constraints, writable-path rules, and audit requirements, must fit within the assigned model's usable input-token budget. Oversized tasks must be returned to the cloud planner for finer decomposition before any local application or resume attempt.
      forbidden_fallbacks:
        - cloud_model_implementation
        - paid_provider_call
        - hidden_implementation_fallback
      required_failure_states:
        application_validation_failed: The proposed application plan failed validation.
        stale_application_plan: The source runtime revision changed after planning.
        duplicate_application: The response or application was already applied.
        approval_missing: The response required approval but none was present.
        approval_checksum_mismatch: The approval checksum did not match the normalized response.
        request_checksum_mismatch: The request checksum no longer matched the active runtime plan.
        response_checksum_mismatch: The normalized response checksum no longer matched the imported response.
        dependency_cycle: The proposed task graph contains a cycle.
        dependency_missing: The proposed task graph references a missing dependency.
        writable_path_violation: The application expands writable paths or touches a forbidden path.
        transaction_failed: The runtime revision could not be written or activated atomically.
        resume_blocked: Local execution cannot resume from the active runtime revision.
        rollback_failed: The prior runtime revision could not be restored safely.
        recovery_required: The plan or active pointer is incomplete or corrupt and needs operator recovery.

    goal: Add a deterministic micro-readiness check that helps decide whether each assigned agent's responsibility can be summarized in a clear local-model micro prompt.
    why: Micro local-agent prompts are most useful when each agent has a focused task. The workflow needs an explicit sizing guard that warns when a story is too broad, too vague, or too large for agent-specific micro-mode assignments.

      - Story 046 local-finalize workflow-run passes.
      - Story 046 cloud-review-prep workflow-run passes.
      - Review bundle is generated for Story 046 but generated bundle files are not committed.
      - Story reports are written for development, testing, and local review.
    test_plan:
      test_layers_version: 1
      unit_tests:
        required: true
        action: add_or_update
        frequency: every_commit
        evidence_or_reason: Add tests for empty response failure, whitespace response failure, non-empty success, content list extraction, choices[0].text extraction, output_text extraction, raw response JSON saving, metadata response_character_count, draft status on empty content, run-prompt empty failure, safety boundaries, artifact/public-readiness blocking, and docs wording.
      integration_tests:
        required: true
        action: add_or_update
        frequency: every_pull_request
        evidence_or_reason: Existing CLI tests cover local-agent command output paths; unit tests exercise command behavior with fake HTTP clients.
      mock_e2e_tests:
        required: true
        action: confirm_existing
        frequency: before_merge
        evidence_or_reason: Existing mock E2E workflow coverage exercises the local story workflow; local model calls are unit-tested with fake HTTP clients.
      live_read_only_checks:
        required: false
        action: not_applicable_with_reason
        frequency: manual_only
        evidence_or_reason: Live local model calls depend on optional host-side LM Studio or Ollama setup and are not required in automated tests.
      remote_dev_smoke_tests:

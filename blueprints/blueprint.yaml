    local_execution_constraints:
      decomposition_authority: cloud_planner
      required_context_must_fit: true
      allow_required_context_trimming: false
      oversized_task_policy: reject_for_cloud_redecomposition
      local_agent_may_redecompose: false
      require_independent_token_estimate: true
      require_final_story_validation: true
      maximum_task_size_contract: The complete required prompt for every Story 062 demo sub-task, including system instructions, role instructions, fixture schema, sandbox rules, dependency handoffs, validation steps, output contract, and no-fallback constraints, must fit within the assigned model's usable input-token budget. Oversized tasks must be rejected for cloud redecomposition before any local or fake model invocation.
      forbidden_fallbacks:
        - cloud_model_implementation
        - codex_implementation
        - hidden_implementation_fallback
      required_failure_states:
        dependency_missing: A declared dependency does not reference a known demo sub-task ID.
        dependency_cycle: The demo sub-task graph contains a cycle.
        context_budget_invalid: The assigned model budget does not leave a positive usable input limit.
        context_over_budget: The independently estimated complete prompt exceeds the usable input budget.
        cloud_redecomposition_required: The demo sub-task is too large for local execution and must be returned to the cloud planner for finer decomposition.
        blocked_by_dependency: A dependency is failed, blocked, or waiting for cloud redecomposition.
        file_boundary_violation: A requested demo write escapes the sandbox root or violates declared writable boundaries.
        sandbox_escape_attempt: A proposed output path uses symlinks, traversal, or absolute-path escape outside the sandbox root.

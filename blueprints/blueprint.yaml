    slug: story_024_remote_dev_validation_bundle
    title: Add remote dev validation bundle
    goal: Create commands that prepare remote-dev validation instructions and record remote-dev validation results for a story.
    why: Local tests and code review are not the same as proving the system works in a remote/dev-like environment. The system needs a structured way to collect deployment URL, logs, smoke test results, integration test results, environment checks, and validation outcomes before a human decides whether work is safe to move forward.

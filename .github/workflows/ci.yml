name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "story/**"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build Docker image
        run: docker compose build

      - name: Run pytest
        run: docker compose run --rm dev pytest

      - name: Run Ruff
        run: docker compose run --rm dev ruff check .

      - name: Verify generated stories are current
        run: |
          docker compose run --rm dev agentic generate-stories
          if [ -n "$(git status --short)" ]; then
            git status --short
            echo "Generated files are missing or the working tree changed. Run generate-stories locally and commit the results."
            exit 1
          fi

      - name: Check generated artifact policy
        run: docker compose run --rm dev agentic artifact-policy

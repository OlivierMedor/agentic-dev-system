[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-system"
version = "0.1.0"
description = "A reusable agentic software development workflow system."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8"
]

[project.scripts]
agentic = "agentic_dev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"